name: PS5 Windows 10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dockurr Windows 10 ve noVNC Baslat
        run: |
          docker run -d --name windows \
            -p 8006:8006 \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            -e VERSION="10" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            --stop-timeout 120 \
            dockurr/windows

          sleep 10

          ssh -p 443 -o StrictHostKeyChecking=no -R 80:localhost:8006 a.pinggy.io
          
